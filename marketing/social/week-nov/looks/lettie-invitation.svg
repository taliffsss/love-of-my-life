<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Lettie, an invitation scroll tied with a gold seal" data-arm-l="90 252" data-arm-r="310 252">
  <!-- Lettie as an invitation scroll: same face, palette and animation parts as promo/lettie.svg; built by marketing/social/week-nov/looks.py -->
  <defs>
    <radialGradient id="l-big-heart" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#ff9fb5"/><stop offset=".6" stop-color="#ee6687"/><stop offset="1" stop-color="#c94468"/></radialGradient>
    <linearGradient id="l-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde1df"/></linearGradient><linearGradient id="s-parch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f6e3c4"/></linearGradient><radialGradient id="s-seal" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#f9de9a"/><stop offset=".55" stop-color="#e6b85c"/><stop offset="1" stop-color="#b8862f"/></radialGradient>
  </defs>
  <ellipse id="l-shadow" cx="200" cy="346" rx="104" ry="11" fill="#000" opacity=".16"/>
  <g id="l-sparkles"><path d="M40 117 L43.64 126.36 L53 130 L43.64 133.64 L40 143 L36.36 133.64 L27 130 L36.36 126.36 Z" fill="#e6b85c"/><path d="M364 86 L366.8 93.2 L374 96 L366.8 98.8 L364 106 L361.2 98.8 L354 96 L361.2 93.2 Z" fill="#f9de9a"/><path d="M30 227 L32.52 233.48 L39 236 L32.52 238.52 L30 245 L27.48 238.52 L21 236 L27.48 233.48 Z" fill="#f7a1b5"/><path d="M372 201 L374.52 207.48 L381 210 L374.52 212.52 L372 219 L369.48 212.52 L363 210 L369.48 207.48 Z" fill="#e6b85c"/><circle cx="60" cy="64" r="4" fill="#f7a1b5"/><circle cx="340" cy="52" r="4" fill="#f9de9a"/></g>
  <g id="l-body">
    <ellipse cx="160" cy="340" rx="23" ry="8" fill="#f3c2cd"/><ellipse cx="240" cy="340" rx="23" ry="8" fill="#f3c2cd"/>
    <g id="l-arm-l" transform="translate(90 252) rotate(22)"><ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#s-parch)" stroke="#e6b85c" stroke-width="4"/></g><g id="l-arm-r" transform="translate(310 252) rotate(-22)"><ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#s-parch)" stroke="#e6b85c" stroke-width="4"/></g>
    <!-- the unrolled parchment -->
    <rect x="94" y="116" width="212" height="206" fill="url(#s-parch)" stroke="#e6b85c" stroke-width="4"/>
    <rect x="104" y="126" width="192" height="186" fill="none" stroke="#f9de9a" stroke-width="2" stroke-dasharray="2 5"/>
    <!-- the rolls at the top and bottom -->
    <rect x="76" y="96" width="248" height="36" rx="18" fill="url(#s-parch)" stroke="#e6b85c" stroke-width="4"/>
    <ellipse cx="94" cy="114" rx="9" ry="12" fill="#f0d9ac" stroke="#e6b85c" stroke-width="3"/><ellipse cx="306" cy="114" rx="9" ry="12" fill="#f0d9ac" stroke="#e6b85c" stroke-width="3"/>
    <rect x="76" y="304" width="248" height="36" rx="18" fill="url(#s-parch)" stroke="#e6b85c" stroke-width="4"/>
    <ellipse cx="94" cy="322" rx="9" ry="12" fill="#f0d9ac" stroke="#e6b85c" stroke-width="3"/><ellipse cx="306" cy="322" rx="9" ry="12" fill="#f0d9ac" stroke="#e6b85c" stroke-width="3"/>
    <!-- the ribbon and gold heart seal -->
    <rect x="94" y="150" width="212" height="26" fill="#e0607e" stroke="#b8405f" stroke-width="2"/>
    <g transform="translate(200 163)"><circle r="22" fill="url(#s-seal)" stroke="#b8862f" stroke-width="2.5"/><path transform="scale(.7) translate(0 -2)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#fff" opacity=".92"/></g>
    <text x="200" y="224" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="600" font-size="27" fill="#8a2c45">You're invited</text>
    <path d="M196 228 L204 228" stroke="#e6b85c" stroke-width="2"/>
    
    <ellipse cx="124" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>
    <ellipse cx="276" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>
    <g id="l-eyes"><g transform="translate(154 262)"><ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/><circle cx="-5" cy="-7" r="5" fill="#fff"/><circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/></g><g transform="translate(246 262)"><ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/><circle cx="-5" cy="-7" r="5" fill="#fff"/><circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/></g></g>
    <g id="l-eyes-happy" opacity="0" fill="none" stroke="#3a1f2b" stroke-width="5" stroke-linecap="round"><path d="M140 266 Q 154 250 168 266"/><path d="M232 266 Q 246 250 260 266"/></g>
    <path id="l-mouth-smile" d="M187 287 Q 200 299 213 287" fill="none" stroke="#3a1f2b" stroke-width="4.5" stroke-linecap="round"/>
    <g id="l-mouth-open" transform="translate(200 288)" opacity="0"><path d="M-12 -1 Q 0 3 12 -1 Q 10 14 0 15 Q -10 14 -12 -1 Z" fill="#8a2c45"/><ellipse cx="0" cy="10" rx="6.5" ry="3.6" fill="#f2849c"/></g>
    <g id="l-hug" opacity="0" transform="translate(200 338)">
      <path transform="scale(1.9)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="url(#l-big-heart)"/>
      <ellipse cx="-16" cy="-19" rx="8" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 -16 -19)"/>
    </g>
  </g>
</svg>
