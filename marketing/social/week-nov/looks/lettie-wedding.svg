<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Lettie, a wedding bell in a veil and flower crown" data-arm-l="100 252" data-arm-r="300 252">
  <!-- Lettie as a wedding bell: same face, palette and animation parts as promo/lettie.svg; built by marketing/social/week-nov/looks.py -->
  <defs>
    <radialGradient id="l-big-heart" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#ff9fb5"/><stop offset=".6" stop-color="#ee6687"/><stop offset="1" stop-color="#c94468"/></radialGradient>
    <linearGradient id="b-bell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6e6ec"/></linearGradient><linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9de9a"/><stop offset="1" stop-color="#e6b85c"/></linearGradient><linearGradient id="l-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#fde1df"/></linearGradient>
  </defs>
  <ellipse id="l-shadow" cx="200" cy="346" rx="104" ry="11" fill="#000" opacity=".16"/>
  <g id="l-sparkles"><path d="M34 108 L37.36 116.64 L46 120 L37.36 123.36 L34 132 L30.64 123.36 L22 120 L30.64 116.64 Z" fill="#f9de9a"/><path d="M370 120 L372.8 127.2 L380 130 L372.8 132.8 L370 140 L367.2 132.8 L360 130 L367.2 127.2 Z" fill="#e6b85c"/><path d="M26 222 L28.240000000000002 227.76 L34 230 L28.240000000000002 232.24 L26 238 L23.759999999999998 232.24 L18 230 L23.759999999999998 227.76 Z" fill="#f7a1b5"/></g>
  <g id="l-body">
    <!-- the veil trails behind the bell -->
    <path d="M200 70 C 130 80, 70 190, 58 346 L 342 346 C 330 190, 270 80, 200 70 Z" fill="#fff" opacity=".42" stroke="#eab4c0" stroke-width="3" stroke-linejoin="round"/>
    <g id="l-arm-l" transform="translate(100 252) rotate(22)"><ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#b-bell)" stroke="#eab4c0" stroke-width="4"/></g><g id="l-arm-r" transform="translate(300 252) rotate(-22)"><ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#b-bell)" stroke="#eab4c0" stroke-width="4"/></g>
    <!-- the bell -->
    <path d="M200 74 C 152 74 122 122 118 190 C 114 246 94 288 76 318 Q 72 336 96 336 L 304 336 Q 328 336 324 318 C 306 288 286 246 282 190 C 278 122 248 74 200 74 Z" fill="url(#b-bell)" stroke="#eab4c0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M150 120 C 140 150 138 180 138 210" fill="none" stroke="#fff" stroke-width="6" opacity=".8" stroke-linecap="round"/>
    <path d="M80 322 Q 200 342 320 322 L 324 334 Q 200 352 76 334 Z" fill="url(#b-gold)" stroke="#b8862f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="200" cy="354" r="11" fill="url(#b-gold)" stroke="#b8862f" stroke-width="2.5"/>
    <!-- the flower crown and bow on top -->
    <path d="M146 112 Q 200 66 254 112" fill="none" stroke="#9cc59a" stroke-width="6" stroke-linecap="round"/><g transform="translate(156 100)"><circle r="10" fill="#fff" stroke="#eab4c0" stroke-width="2"/><circle r="3.6" fill="#e6b85c"/></g><g transform="translate(178 84)"><circle r="10" fill="#fff" stroke="#eab4c0" stroke-width="2"/><circle r="3.6" fill="#e6b85c"/></g><g transform="translate(200 78)"><circle r="10" fill="#fff" stroke="#eab4c0" stroke-width="2"/><circle r="3.6" fill="#e6b85c"/></g><g transform="translate(222 84)"><circle r="10" fill="#fff" stroke="#eab4c0" stroke-width="2"/><circle r="3.6" fill="#e6b85c"/></g><g transform="translate(244 100)"><circle r="10" fill="#fff" stroke="#eab4c0" stroke-width="2"/><circle r="3.6" fill="#e6b85c"/></g>
    <!-- a gold ring on a ribbon -->
    <g transform="translate(200 160)"><circle r="13" fill="none" stroke="#e6b85c" stroke-width="6"/><path d="M0 -26 L8 -18 L0 -11 L-8 -18 Z" fill="#fff" stroke="#e6b85c" stroke-width="2.5" stroke-linejoin="round"/></g>
    
    <ellipse cx="130" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>
    <ellipse cx="270" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>
    <g id="l-eyes"><g transform="translate(154 262)"><ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/><circle cx="-5" cy="-7" r="5" fill="#fff"/><circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/></g><g transform="translate(246 262)"><ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/><circle cx="-5" cy="-7" r="5" fill="#fff"/><circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/></g></g>
    <g id="l-eyes-happy" opacity="0" fill="none" stroke="#3a1f2b" stroke-width="5" stroke-linecap="round"><path d="M140 266 Q 154 250 168 266"/><path d="M232 266 Q 246 250 260 266"/></g>
    <path id="l-mouth-smile" d="M187 287 Q 200 299 213 287" fill="none" stroke="#3a1f2b" stroke-width="4.5" stroke-linecap="round"/>
    <g id="l-mouth-open" transform="translate(200 288)" opacity="0"><path d="M-12 -1 Q 0 3 12 -1 Q 10 14 0 15 Q -10 14 -12 -1 Z" fill="#8a2c45"/><ellipse cx="0" cy="10" rx="6.5" ry="3.6" fill="#f2849c"/></g>
    <g id="l-hug" opacity="0" transform="translate(200 338)">
      <path transform="scale(1.9)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="url(#l-big-heart)"/>
      <ellipse cx="-16" cy="-19" rx="8" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 -16 -19)"/>
    </g>
    <!-- the bouquet -->
    <g id="l-bouquet" transform="translate(330 318) rotate(-12)">
      <path d="M-8 0 L-3 36 M8 0 L3 36 M0 0 L0 38" stroke="#6faa73" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-16" cy="-6" r="13" fill="#fff" stroke="#eab4c0" stroke-width="2.5"/><circle cx="-16" cy="-6" r="4.5" fill="#f7a1b5"/>
      <circle cx="16" cy="-6" r="13" fill="#fde1df" stroke="#eab4c0" stroke-width="2.5"/><circle cx="16" cy="-6" r="4.5" fill="#e6b85c"/>
      <circle cx="0" cy="-18" r="14" fill="#fff" stroke="#eab4c0" stroke-width="2.5"/><circle cx="0" cy="-18" r="5" fill="#f58fa8"/>
      <circle cx="0" cy="2" r="12" fill="#fde1df" stroke="#eab4c0" stroke-width="2.5"/><circle cx="0" cy="2" r="4" fill="#f7a1b5"/>
    </g>
  </g>
</svg>
