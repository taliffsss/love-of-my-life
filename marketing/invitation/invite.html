<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Love of My Life: invitation cards</title>
    <!-- One social card per URL: invite.html?card=inv-feed-hook (see invite.js CARDS). render_cards.py screenshots them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
    <style>
      :root { --bg: #160a14; --bg-2: #2a1220; --text: #fbeef0; --muted: rgba(251, 238, 240, .72); --accent: #f2a7b8; --gold: #f0cfa8; --paper: #fffaf3; --ink: #3a2230; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      .card { position: relative; overflow: hidden; color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background: radial-gradient(110% 90% at 28% 12%, #3a1630, var(--bg-2) 45%, var(--bg) 82%); }
      .card.clear { background: transparent; }
      .abs { position: absolute; }
      .hearts span { position: absolute; color: var(--accent); opacity: .3; line-height: 1; filter: drop-shadow(0 0 10px rgba(242, 167, 184, .5)); }
      .kicker { font-size: 28px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
      .headline { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; line-height: 1.02; }
      .sub { font-size: 34px; line-height: 1.35; color: var(--muted); }
      .hand { font-family: 'Caveat', cursive; font-weight: 700; color: var(--gold); }
      .url { display: inline-block; padding: 16px 30px; border-radius: 999px; font-size: 34px; font-weight: 600; color: #2a1220; background: linear-gradient(135deg, var(--gold), var(--accent)); box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
      .logo { display: flex; align-items: center; gap: 16px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 44px; }
      .logo svg { width: 46px; height: 46px; color: #e0607e; }
      .phone { border-radius: 44px; padding: 12px; background: linear-gradient(160deg, #3a2434, #120810); box-shadow: 0 0 0 2px rgba(255, 255, 255, .08) inset, 0 34px 80px rgba(0, 0, 0, .55); }
      .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #000; }
      .phone img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .phone .island { position: absolute; left: 50%; top: 10px; width: 30%; height: 22px; margin-left: -15%; border-radius: 14px; background: #000; }
      .lettie svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 22px 34px rgba(0, 0, 0, .35)); }
      .clear .lettie svg { filter: none; }
      .note { font-size: 20px; color: rgba(251, 238, 240, .5); }
      .qr { background: var(--paper); border-radius: 22px; padding: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
      .qr img { display: block; width: 100%; image-rendering: pixelated; }
    
      .card.ivory { color: var(--ink); background: radial-gradient(110% 90% at 30% 10%, #fffaf3, #fde8e4 55%, #f9d3d6 100%); }
      .ivory .hearts span { color: #e0607e; opacity: .16; filter: none; }
      .ivory .kicker { color: #a8741f; }
      .ivory .sub { color: rgba(58, 34, 48, .78); }
      .ivory .logo { color: var(--ink); }
      .ivory .url { color: #fffaf3; background: linear-gradient(135deg, #c98a2b, #e0607e); box-shadow: 0 10px 26px rgba(224, 96, 126, .35); }
      .ivory .note { color: rgba(58, 34, 48, .55); }
      .ivory .lettie svg { filter: drop-shadow(0 18px 24px rgba(120, 50, 70, .22)); }
      .ivory .phone { box-shadow: 0 0 0 2px rgba(0, 0, 0, .06) inset, 0 28px 60px rgba(120, 50, 70, .32); }
      .step { display: flex; gap: 26px; align-items: flex-start; }
      .step .n { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 52px; color: #2a1220; background: linear-gradient(135deg, var(--gold), var(--accent)); }
      .step .t { font-size: 38px; font-weight: 600; line-height: 1.15; }
      .step .d { font-size: 28px; line-height: 1.3; color: var(--muted); margin-top: 6px; }
      .ivory .step .t { color: var(--ink); }
      .ivory .step .d { color: rgba(58, 34, 48, .72); }
      .label { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 54px; text-align: center; }
      .cap { display: inline-block; max-width: 940px; padding: 20px 34px; border-radius: 44px; font-size: 56px; font-weight: 600; line-height: 1.2; text-align: center; color: #fff; background: rgba(30, 12, 24, .84); }
      .card.bezel .phone { background: transparent; border: 12px solid #261622; padding: 0; border-radius: 44px; box-sizing: border-box; }
      .card.bezel .phone .screen { background: transparent; border-radius: 32px; }
      .card.bezel .phone .screen img { display: none; }
      .chip { display: inline-block; padding: 10px 22px; border-radius: 999px; font-size: 26px; font-weight: 600; color: #2a1220; background: rgba(240, 207, 168, .92); }
    </style>
  </head>
  <body>
    <div id="card" class="card"></div>
    <script src="invite.js"></script>
  </body>
</html>
