<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Sample "photo" for the promo: a night out under the ferris wheel. Illustration, not a real photo. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140f35"/><stop offset=".55" stop-color="#3a2163"/><stop offset=".85" stop-color="#a24a78"/><stop offset="1" stop-color="#e98a86"/></linearGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#fff8e2"/><stop offset="1" stop-color="#f3dca6"/></radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#night)"/>
  <g fill="#fff">
    <circle cx="120" cy="140" r="3"/><circle cx="300" cy="260" r="2.2"/><circle cx="460" cy="110" r="2.6"/><circle cx="620" cy="220" r="1.8"/>
    <circle cx="1060" cy="420" r="2.4"/><circle cx="200" cy="480" r="2"/><circle cx="560" cy="400" r="2.4"/><circle cx="1110" cy="160" r="2"/>
    <circle cx="80" cy="700" r="1.8"/><circle cx="360" cy="620" r="2.2"/>
  </g>
  <circle cx="930" cy="230" r="86" fill="url(#moon)"/>
  <circle cx="965" cy="205" r="80" fill="#1a1340"/>
  <!-- the wheel -->
  <g transform="translate(720 900)">
    <circle r="330" fill="none" stroke="#f6c3d1" stroke-width="10" opacity=".9"/>
    <circle r="300" fill="none" stroke="#f6c3d1" stroke-width="4" opacity=".55"/>
    <g stroke="#f6c3d1" stroke-width="5" opacity=".7">
      <line x1="-330" y1="0" x2="330" y2="0"/><line x1="0" y1="-330" x2="0" y2="330"/>
      <line x1="-233" y1="-233" x2="233" y2="233"/><line x1="-233" y1="233" x2="233" y2="-233"/>
    </g>
    <circle r="30" fill="#f6c3d1"/>
    <g>
      <circle cx="330" cy="0" r="30" fill="#ffd39a"/><circle cx="-330" cy="0" r="30" fill="#f2a7b8"/>
      <circle cx="0" cy="330" r="30" fill="#a9b8ff"/><circle cx="0" cy="-330" r="30" fill="#ffd39a"/>
      <circle cx="233" cy="233" r="30" fill="#f2a7b8"/><circle cx="-233" cy="-233" r="30" fill="#a9b8ff"/>
      <circle cx="233" cy="-233" r="30" fill="#a9b8ff"/><circle cx="-233" cy="233" r="30" fill="#ffd39a"/>
    </g>
    <path d="M-60 330 L -200 600 M 60 330 L 200 600" stroke="#f6c3d1" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- the city -->
  <g fill="#1d1238">
    <rect x="0" y="1180" width="140" height="320"/><rect x="130" y="1100" width="110" height="400"/><rect x="230" y="1230" width="160" height="270"/>
    <rect x="380" y="1150" width="120" height="350"/><rect x="980" y="1120" width="120" height="380"/><rect x="1090" y="1210" width="110" height="290"/>
    <rect y="1400" width="1200" height="100"/>
  </g>
  <g fill="#ffd39a" opacity=".85">
    <rect x="30" y="1220" width="16" height="22"/><rect x="80" y="1270" width="16" height="22"/><rect x="160" y="1140" width="16" height="22"/>
    <rect x="200" y="1200" width="16" height="22"/><rect x="270" y="1270" width="16" height="22"/><rect x="420" y="1190" width="16" height="22"/>
    <rect x="460" y="1250" width="16" height="22"/><rect x="1010" y="1160" width="16" height="22"/><rect x="1060" y="1230" width="16" height="22"/>
    <rect x="1130" y="1250" width="16" height="22"/>
  </g>
</svg>
