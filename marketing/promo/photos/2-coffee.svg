<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Sample "photo" for the promo: a coffee date. Illustration, not a real photo. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3d6"/><stop offset="1" stop-color="#f0b9ad"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b56f57"/><stop offset="1" stop-color="#7d4337"/></linearGradient>
    <linearGradient id="mugA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#efe2d8"/></linearGradient>
    <linearGradient id="mugB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7b3c3"/><stop offset="1" stop-color="#de8aa0"/></linearGradient>
    <radialGradient id="window" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff6e6"/><stop offset="1" stop-color="#fbe3d6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#wall)"/>
  <circle cx="900" cy="300" r="420" fill="url(#window)"/>
  <g fill="#e9a99c" opacity=".55"><circle cx="160" cy="210" r="16"/><circle cx="260" cy="420" r="10"/><circle cx="1040" cy="620" r="14"/><circle cx="120" cy="640" r="9"/></g>
  <rect y="1080" width="1200" height="420" fill="url(#table)"/>
  <rect y="1080" width="1200" height="16" fill="#c98468" opacity=".7"/>
  <!-- steam, curling into a heart -->
  <path d="M600 760 C 520 690 470 600 540 560 C 580 538 600 572 600 600 C 600 572 620 538 660 560 C 730 600 680 690 600 760 Z" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".75"/>
  <path d="M430 800 c -30 -40 30 -60 0 -110" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".5"/>
  <path d="M770 800 c 30 -40 -30 -60 0 -110" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".5"/>
  <!-- two mugs -->
  <g>
    <ellipse cx="420" cy="1166" rx="190" ry="24" fill="#5e2f27" opacity=".35"/>
    <path d="M300 850 h 240 v 220 q 0 90 -90 90 h -60 q -90 0 -90 -90 z" fill="url(#mugA)"/>
    <path d="M540 900 q 80 0 80 70 q 0 70 -84 70" fill="none" stroke="#efe2d8" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="420" cy="850" rx="120" ry="26" fill="#8a5240"/>
    <ellipse cx="420" cy="850" rx="96" ry="18" fill="#c08a6c"/>
    <path transform="translate(420 850) scale(1.3 .55)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#fff4e8"/>
  </g>
  <g>
    <ellipse cx="780" cy="1166" rx="190" ry="24" fill="#5e2f27" opacity=".35"/>
    <path d="M660 850 h 240 v 220 q 0 90 -90 90 h -60 q -90 0 -90 -90 z" fill="url(#mugB)"/>
    <path d="M660 900 q -80 0 -80 70 q 0 70 84 70" fill="none" stroke="#de8aa0" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="780" cy="850" rx="120" ry="26" fill="#8a5240"/>
    <ellipse cx="780" cy="850" rx="96" ry="18" fill="#c08a6c"/>
    <path transform="translate(780 850) scale(1.3 .55)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#fff4e8"/>
  </g>
</svg>
