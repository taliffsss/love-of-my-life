    <path transform="translate(600 570) scale(5)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#f59ab0"/>
    <path transform="translate(765 680) scale(4.2)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#e0607e"/>
    <g fill="#fff" opacity=".45"><ellipse cx="400" cy="590" rx="16" ry="9" transform="rotate(-30 400 590)"/><ellipse cx="566" cy="512" rx="18" ry="10" transform="rotate(-30 566 512)"/><ellipse cx="737" cy="632" rx="15" ry="8" transform="rotate(-30 737 632)"/></g>
