<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Lettie, the little love letter">
  <!-- Lettie: Love of My Life's mascot, a little love letter with a heart seal.
       Parts have ids so promo.js can animate them: #l-body (bounce), #l-arm-l / #l-arm-r (rotate about the shoulder),
       #l-eyes (blink), #l-mouth-smile / #l-mouth-open (talk), #l-hug (the heart held in the "love" pose). -->
  <defs>
    <linearGradient id="l-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#fde1df"/>
    </linearGradient>
    <linearGradient id="l-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeef0"/>
      <stop offset="1" stop-color="#fbd6dc"/>
    </linearGradient>
    <radialGradient id="l-seal" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#f58fa8"/>
      <stop offset=".55" stop-color="#e0607e"/>
      <stop offset="1" stop-color="#b8405f"/>
    </radialGradient>
    <radialGradient id="l-big-heart" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ff9fb5"/>
      <stop offset=".6" stop-color="#ee6687"/>
      <stop offset="1" stop-color="#c94468"/>
    </radialGradient>
  </defs>

  <ellipse id="l-shadow" cx="200" cy="344" rx="104" ry="11" fill="#000" opacity=".16"/>

  <g id="l-body">
    <!-- feet -->
    <ellipse cx="160" cy="326" rx="23" ry="11" fill="#f3c2cd"/>
    <ellipse cx="240" cy="326" rx="23" ry="11" fill="#f3c2cd"/>

    <!-- arms, drawn hanging down from the shoulder; promo.js rotates them -->
    <g id="l-arm-l" transform="translate(76 238) rotate(22)">
      <ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#l-paper)" stroke="#eab4c0" stroke-width="4"/>
    </g>
    <g id="l-arm-r" transform="translate(324 238) rotate(-22)">
      <ellipse cx="0" cy="20" rx="14" ry="23" fill="url(#l-paper)" stroke="#eab4c0" stroke-width="4"/>
    </g>

    <!-- the envelope -->
    <rect x="70" y="120" width="260" height="200" rx="34" fill="url(#l-paper)" stroke="#eab4c0" stroke-width="4"/>
    <!-- the flap, closed: a soft triangle down to the seal -->
    <path d="M90 126 L 200 212 L 310 126 Z" fill="url(#l-flap)" opacity=".75"/>
    <path d="M90 126 L 200 212 L 310 126" fill="none" stroke="#efc0ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the heart seal -->
    <g transform="translate(200 212)">
      <path d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="url(#l-seal)"/>
      <ellipse cx="-8" cy="-10" rx="5" ry="3.2" fill="#fff" opacity=".55" transform="rotate(-30 -8 -10)"/>
    </g>

    <!-- the little curl on top, with a heart -->
    <path d="M200 121 C 193 108, 211 104, 204 92" fill="none" stroke="#eab4c0" stroke-width="4" stroke-linecap="round"/>
    <path transform="translate(205 85) scale(.42)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="#f2a7b8"/>

    <!-- cheeks -->
    <ellipse cx="122" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>
    <ellipse cx="278" cy="288" rx="17" ry="9" fill="#f7a1b5" opacity=".6"/>

    <!-- eyes (open); #l-eyes-happy are closed, smiling eyes for the "love" pose -->
    <g id="l-eyes">
      <g transform="translate(154 262)">
        <ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/>
        <circle cx="-5" cy="-7" r="5" fill="#fff"/>
        <circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/>
      </g>
      <g transform="translate(246 262)">
        <ellipse cx="0" cy="0" rx="14" ry="18" fill="#3a1f2b"/>
        <circle cx="-5" cy="-7" r="5" fill="#fff"/>
        <circle cx="5" cy="6" r="2.4" fill="#fff" opacity=".85"/>
      </g>
    </g>
    <g id="l-eyes-happy" opacity="0" fill="none" stroke="#3a1f2b" stroke-width="5" stroke-linecap="round">
      <path d="M140 266 Q 154 250 168 266"/>
      <path d="M232 266 Q 246 250 260 266"/>
    </g>

    <!-- mouth: a smile, or open while talking (promo.js scales it) -->
    <path id="l-mouth-smile" d="M187 287 Q 200 299 213 287" fill="none" stroke="#3a1f2b" stroke-width="4.5" stroke-linecap="round"/>
    <g id="l-mouth-open" transform="translate(200 288)" opacity="0">
      <path d="M-12 -1 Q 0 3 12 -1 Q 10 14 0 15 Q -10 14 -12 -1 Z" fill="#8a2c45"/>
      <ellipse cx="0" cy="10" rx="6.5" ry="3.6" fill="#f2849c"/>
    </g>

    <!-- the big heart held in front, for the "love" pose -->
    <g id="l-hug" opacity="0" transform="translate(200 338)">
      <path transform="scale(1.9)" d="M0 15 C -19 3, -25 -8, -17 -16 C -11 -22, -2 -20, 0 -12 C 2 -20, 11 -22, 17 -16 C 25 -8, 19 3, 0 15 Z" fill="url(#l-big-heart)"/>
      <ellipse cx="-16" cy="-19" rx="8" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 -16 -19)"/>
    </g>
  </g>
</svg>
