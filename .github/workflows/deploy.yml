name: Deploy (Docker Swarm + Traefik)

# Run by hand: Actions → Deploy → Run workflow. Builds the image, pushes it to Docker Hub and rolls the stack on your
# server, like the hris-api deploy.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to build and deploy, e.g. 2.0.0'
        required: true
        default: 'latest'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            taliffsss/love-of-my-life:${{ inputs.version }}
            taliffsss/love-of-my-life:latest

  deploy:
    name: Deploy to the server
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy the stack file and deploy script
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml deploy/deploy.sh \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/

      - name: Roll the stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "cd ${{ secrets.PROD_DEPLOY_PATH }} && sh deploy.sh ${{ inputs.version }} jinelin"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
