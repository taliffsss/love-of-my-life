name: Upload photos to Spaces

# Drop images into uploads/ and push to main (or run this by hand). They are sent to
# DigitalOcean Spaces, their URLs are saved to src/data/carousel.json, and the site is
# redeployed so the carousel shows them.
on:
  push:
    branches: [main]
    paths: ['uploads/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upload-photos
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/upload-to-spaces.mjs
        env:
          SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
          SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_ENDPOINT_URL: ${{ secrets.SPACES_ENDPOINT_URL }}
          SPACES_FOLDER: ${{ secrets.SPACES_FOLDER }}
          SPACES_CDN_URL: ${{ secrets.SPACES_CDN_URL }}
      - id: commit
        run: |
          git add -A uploads src/data/carousel.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add uploaded photos to carousel"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: upload
    if: needs.upload.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
