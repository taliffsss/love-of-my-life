# Auto release: push a version tag and everything else happens.
#
#   git tag v2.0.0 && git push origin v2.0.0        (or run this workflow by hand with the tag)
#
# tag → CI checks (incl. the Docker smoke test) → image pushed to Docker Hub (2.0.0, 2.0, latest) → GitHub Release with
# generated notes → (optional) deploy to the production Swarm behind Traefik.
# A tag with a hyphen (v2.0.0-rc.1) is a pre-release: it never moves `latest` and never deploys.
#
# One-time setup (repo → Settings):
#   Secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN              (required for the image)
#             SAAS_DOCKERHUB_TOKEN                              (the Docker Hub token used instead of DOCKERHUB_TOKEN for a release of branch main-v2)
#             SAAS_SPACES_ACCESS_KEY, _SECRET_KEY, _BUCKET, _REGION, _ENDPOINT_URL, _FOLDER, _CDN_URL
#                                                               (main-v2 only: written to the server's .env.production as SPACES_* on every deploy)
#             SAAS_MAIL_PASSWORD (+ optional _HOST, _PORT, _ENCRYPTION, _USERNAME, _FROM_ADDRESS, _FROM_NAME)
#                                                               (main-v2 only: written to the server's .env.production as MAIL_*; defaults are Resend's SMTP)
#             ADMIN_EMAIL, ADMIN_PASSWORD                       (main-v2 only: written to the server's .env.production; the first administrator is created from them at start, once)
#             QA_EMAIL, QA_PASSWORD                             (main-v2 only: a normal test account made the same way as the administrator, once)
#             PAYMENTS_DRIVER, PAYMONGO_SECRET_KEY, PAYMONGO_PUBLIC_KEY, PAYMONGO_WEBHOOK_SECRET
#                                                               (main-v2 only: written to the server's .env.production; replaces the old values)
#             SENTRY_DSN or SENTRY_NALUZ_DSN                   (main-v2 only, secret or variable: written to the server's .env.production; none = no error reporting)
#             SENTRY_TRACES_SAMPLE_RATE, SENTRY_PROFILES_SAMPLE_RATE, SENTRY_ENABLE_LOGS, LOG_CHANNEL, LOG_STACK (optional, secret or variable, written when set)
#             DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER          (only for the deploy job)
#   Variables DOCKER_IMAGE (default taliffsss/loveofmylife; may also be a secret)
#             SAAS_DOCKER_IMAGE (the same, for a release of branch main-v2; default taliffsss/loveofmylife; secret or variable)
#             PAYMONGO_SUBSCRIPTIONS, PAYMONGO_EWALLET (main-v2 only, true or false, default false: PayMongo-run subscriptions; GCash and PayMaya on the order page)
#             SITE_URL     (public address checked after a deploy; default https://loveofmylife.love)
#             SAAS_DEPLOY_PATH (REQUIRED for a release of branch main-v2: the dir on the server holding that deploy's
#                           deploy/.env.production; may also be a secret. No default, so v2 can never overwrite the old deploy)
#             DEPLOY_PATH  (same, for a release of any other branch; default /opt/love-of-my-life; may also be a secret)
#             AUTO_DEPLOY  ("true" turns the deploy job on; keep it off until you trust the pipeline)
#   Environment `production` → add required reviewers so a human approves every deploy.
# Branch main-v2: the `context` job checks the tagged commit (a manual run started from main-v2, or a tag whose commit is in
# main-v2 and not in main). Such a release pushes the image named by SAAS_DOCKER_IMAGE and deploys to SAAS_DEPLOY_PATH;
# anything else uses DOCKER_IMAGE and DEPLOY_PATH.
# Secrets in deploy/.env.production stay on the server; they never reach GitHub or the image.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v2.0.0 (created on the chosen branch if it does not exist yet)"
        required: true
        default: "v2.0.0"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  STACK: loveofmylife

jobs:
  # A manual run may name a tag that does not exist yet: create it on the chosen commit (pushes made with
  # GITHUB_TOKEN do not start another run of this workflow).
  tag:
    name: Make sure the tag exists
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          else
            echo "::error::Tag $TAG does not exist."; exit 1
          fi

  # Is this a release of branch main-v2? That decides the image variable (SAAS_DOCKER_IMAGE) and the deploy path (SAAS_DEPLOY_PATH).
  context:
    name: Which branch is this release from?
    needs: tag
    runs-on: ubuntu-24.04
    outputs:
      v2: ${{ steps.c.outputs.v2 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the branch check needs history
      - id: c
        run: |
          sha=$(git rev-parse HEAD)
          v2=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "main-v2" ]; then
            v2=true
          elif git merge-base --is-ancestor "$sha" origin/main-v2 2>/dev/null && ! git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then
            v2=true
          fi
          echo "v2=$v2" >> "$GITHUB_OUTPUT"
          echo "Branch main-v2: $v2"

  verify:
    name: Checks (same as CI)
    needs: tag
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: [verify, context]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.context.outputs.v2 == 'true' && (secrets.SAAS_DOCKER_IMAGE || vars.SAAS_DOCKER_IMAGE || 'taliffsss/loveofmylife') || (secrets.DOCKER_IMAGE || vars.DOCKER_IMAGE || 'taliffsss/loveofmylife') }}
    outputs:
      prerelease: ${{ steps.pre.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - id: pre
        run: |
          case "$TAG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: Image name needs the Docker Hub namespace
        run: |
          # "loveofmylife" alone would mean docker.io/library/loveofmylife (not ours: "insufficient_scope"); add the account name
          case "$IMAGE" in */*) ;; *) echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE" >> "$GITHUB_ENV" ;; esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ needs.context.outputs.v2 == 'true' && secrets.SAAS_DOCKERHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.pre.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.pre.outputs.prerelease == 'false' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [image, context]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.context.outputs.v2 == 'true' && (secrets.SAAS_DOCKER_IMAGE || vars.SAAS_DOCKER_IMAGE || 'taliffsss/loveofmylife') || (secrets.DOCKER_IMAGE || vars.DOCKER_IMAGE || 'taliffsss/loveofmylife') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Image name needs the Docker Hub namespace
        run: |
          # "loveofmylife" alone would mean docker.io/library/loveofmylife (not ours: "insufficient_scope"); add the account name
          case "$IMAGE" in */*) ;; *) echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE" >> "$GITHUB_ENV" ;; esac
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "Love of My Life ${TAG}")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease) || flags+=(--latest)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its notes alone."
          else
            gh release create "$TAG" "${flags[@]}" \
              --notes "Image: \`${IMAGE}:${TAG#v}\`"$'\n\n'"Deploy: see DEPLOY.md."
          fi

  deploy:
    name: Deploy to production
    needs: [image, release, context]
    if: ${{ vars.AUTO_DEPLOY == 'true' && needs.image.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    environment: production # configure required reviewers here: nothing deploys unapproved
    env:
      HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      IMAGE: ${{ needs.context.outputs.v2 == 'true' && (secrets.SAAS_DOCKER_IMAGE || vars.SAAS_DOCKER_IMAGE || 'taliffsss/loveofmylife') || (secrets.DOCKER_IMAGE || vars.DOCKER_IMAGE || 'taliffsss/loveofmylife') }}
      V2: ${{ needs.context.outputs.v2 }}
      LEGACY_DIR: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/love-of-my-life' }}
      SAAS_DIR: ${{ secrets.SAAS_DEPLOY_PATH || vars.SAAS_DEPLOY_PATH }}
      HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
      HAS_SAAS_SPACES: ${{ secrets.SAAS_SPACES_ACCESS_KEY != '' }}
      HAS_SAAS_MAIL: ${{ secrets.SAAS_MAIL_PASSWORD != '' }}
      HAS_ADMIN: ${{ secrets.ADMIN_EMAIL != '' && secrets.ADMIN_PASSWORD != '' }}
      HAS_QA: ${{ secrets.QA_EMAIL != '' && secrets.QA_PASSWORD != '' }}
      HAS_PAYMONGO: ${{ secrets.PAYMONGO_SECRET_KEY != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_DSN != '' || vars.SENTRY_DSN != '' || secrets.SENTRY_NALUZ_DSN != '' || vars.SENTRY_NALUZ_DSN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Choose the deploy path (main-v2 uses SAAS_DEPLOY_PATH)
        run: |
          if [ "$V2" = "true" ]; then
            [ -n "$SAAS_DIR" ] || { echo "::error title=Deployment configuration::Branch main-v2 deploys to SAAS_DEPLOY_PATH, which is not set (variable or secret)."; exit 1; }
            echo "DIR=$SAAS_DIR" >> "$GITHUB_ENV"
          else
            echo "DIR=$LEGACY_DIR" >> "$GITHUB_ENV"
          fi
          echo "Branch main-v2: $V2"

      - name: Image name needs the Docker Hub namespace
        run: |
          # "loveofmylife" alone would mean docker.io/library/loveofmylife (not ours: "insufficient_scope"); add the account name
          case "$IMAGE" in */*) ;; *) echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE" >> "$GITHUB_ENV" ;; esac
      - name: Validate the deployment configuration
        run: |
          fail() { echo "::error title=Deployment configuration::$1"; exit 1; }
          [ "$HAS_SSH_KEY" = "true" ] || fail "Secret DEPLOY_SSH_KEY is not set."
          case "$HOST" in @*|*@) fail "Secrets DEPLOY_USER and DEPLOY_HOST must both be set." ;; esac

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Ship the stack file
        run: |
          $SSH "$HOST" "mkdir -p '$DIR/deploy'"
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes deploy/docker-stack.yml "$HOST:$DIR/deploy/docker-stack.yml"
          $SSH "$HOST" "test -f '$DIR/deploy/.env.production'" \
            || { echo "::error::$DIR/deploy/.env.production is missing on the server (copy deploy/.env.production.example and fill it in)."; exit 1; }

      - name: Apply the SAAS_SPACES_* secrets to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_SAAS_SPACES == 'true' }}
        env:
          SAAS_SPACES_ACCESS_KEY: ${{ secrets.SAAS_SPACES_ACCESS_KEY }}
          SAAS_SPACES_SECRET_KEY: ${{ secrets.SAAS_SPACES_SECRET_KEY }}
          SAAS_SPACES_BUCKET: ${{ secrets.SAAS_SPACES_BUCKET }}
          SAAS_SPACES_REGION: ${{ secrets.SAAS_SPACES_REGION }}
          SAAS_SPACES_ENDPOINT_URL: ${{ secrets.SAAS_SPACES_ENDPOINT_URL }}
          SAAS_SPACES_FOLDER: ${{ secrets.SAAS_SPACES_FOLDER }}
          SAAS_SPACES_CDN_URL: ${{ secrets.SAAS_SPACES_CDN_URL }}
        run: |
          # SAAS_SPACES_X on GitHub becomes SPACES_X in deploy/.env.production on the server: any older SPACES_ lines are replaced.
          # The values travel in a file (chmod 600), not on a command line; Docker's env_file keeps quotes, so none are written.
          umask 077
          : > spaces.env
          for k in ACCESS_KEY SECRET_KEY BUCKET REGION ENDPOINT_URL FOLDER CDN_URL; do
            v="SAAS_SPACES_$k"
            printf 'SPACES_%s=%s\n' "$k" "$(printf '%s' "${!v}" | tr -d '\r\n')" >> spaces.env
          done
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes spaces.env "$HOST:$DIR/deploy/.spaces.env.tmp"
          rm -f spaces.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v '^SPACES_' .env.production > .env.production.new || true
            cat .spaces.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .spaces.env.tmp
            echo 'SPACES_* updated:'; grep -c '^SPACES_' .env.production"

      - name: Apply the SAAS_MAIL_* secrets to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_SAAS_MAIL == 'true' }}
        env:
          SAAS_MAIL_PASSWORD: ${{ secrets.SAAS_MAIL_PASSWORD }}
          SAAS_MAIL_HOST: ${{ secrets.SAAS_MAIL_HOST }}
          SAAS_MAIL_PORT: ${{ secrets.SAAS_MAIL_PORT }}
          SAAS_MAIL_ENCRYPTION: ${{ secrets.SAAS_MAIL_ENCRYPTION }}
          SAAS_MAIL_USERNAME: ${{ secrets.SAAS_MAIL_USERNAME }}
          SAAS_MAIL_FROM_ADDRESS: ${{ secrets.SAAS_MAIL_FROM_ADDRESS }}
          SAAS_MAIL_FROM_NAME: ${{ secrets.SAAS_MAIL_FROM_NAME }}
        run: |
          # SAAS_MAIL_X on GitHub becomes MAIL_X in deploy/.env.production on the server (Resend's SMTP when not set); older MAIL_ lines are replaced.
          umask 077
          : > mail.env
          printf 'MAIL_MAILER=smtp\n' >> mail.env
          for k in HOST PORT ENCRYPTION USERNAME FROM_ADDRESS FROM_NAME PASSWORD; do
            v="SAAS_MAIL_$k"; val="$(printf '%s' "${!v}" | tr -d '\r\n')"
            case "$k" in
              HOST) : "${val:=smtp.resend.com}" ;; PORT) : "${val:=465}" ;; ENCRYPTION) : "${val:=ssl}" ;; USERNAME) : "${val:=resend}" ;;
              FROM_ADDRESS) : "${val:=no-reply@loveofmylife.love}" ;; FROM_NAME) : "${val:=Love of My Life}" ;;
            esac
            printf 'MAIL_%s=%s\n' "$k" "$val" >> mail.env
          done
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes mail.env "$HOST:$DIR/deploy/.mail.env.tmp"
          rm -f mail.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v '^MAIL_' .env.production > .env.production.new || true
            cat .mail.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .mail.env.tmp
            echo 'MAIL_* updated:'; grep -c '^MAIL_' .env.production"

      - name: Apply the ADMIN_* secrets to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_ADMIN == 'true' }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # The container creates the administrator from these when no account has that e-mail yet (bin/ensure-admin.php); it never changes an existing one.
          umask 077
          printf 'ADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' "$(printf '%s' "$ADMIN_EMAIL" | tr -d '\r\n')" "$(printf '%s' "$ADMIN_PASSWORD" | tr -d '\r\n')" > admin.env
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes admin.env "$HOST:$DIR/deploy/.admin.env.tmp"
          rm -f admin.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v '^ADMIN_' .env.production > .env.production.new || true
            cat .admin.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .admin.env.tmp
            echo 'ADMIN_* updated:'; grep -c '^ADMIN_' .env.production"

      - name: Apply the QA_* secrets to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_QA == 'true' }}
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          # The container creates a normal test account from these when no account has that e-mail yet (bin/ensure-qa.php); it never changes an existing one.
          umask 077
          printf 'QA_EMAIL=%s\nQA_PASSWORD=%s\n' "$(printf '%s' "$QA_EMAIL" | tr -d '\r\n')" "$(printf '%s' "$QA_PASSWORD" | tr -d '\r\n')" > qa.env
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes qa.env "$HOST:$DIR/deploy/.qa.env.tmp"
          rm -f qa.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v '^QA_' .env.production > .env.production.new || true
            cat .qa.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .qa.env.tmp
            echo 'QA_* updated:'; grep -c '^QA_' .env.production"

      - name: Apply the PAYMONGO_* settings to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_PAYMONGO == 'true' }}
        env:
          PAYMENTS_DRIVER: ${{ secrets.PAYMENTS_DRIVER }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY }}
          PAYMONGO_PUBLIC_KEY: ${{ secrets.PAYMONGO_PUBLIC_KEY }}
          PAYMONGO_WEBHOOK_SECRET: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
          PAYMONGO_SUBSCRIPTIONS: ${{ vars.PAYMONGO_SUBSCRIPTIONS }}
          PAYMONGO_EWALLET: ${{ vars.PAYMONGO_EWALLET }}
        run: |
          # The keys come from secrets, the two switches from variables (anything but "true" is written as false). The values travel in a file
          # (chmod 600), not on a command line. Older PAYMENTS_DRIVER and PAYMONGO_ lines are replaced; PAYMENTS_MANUAL_INSTRUCTIONS is kept.
          umask 077
          clean() { printf '%s' "$1" | tr -d '\r\n'; }
          flag() { [ "$(clean "$1")" = "true" ] && echo true || echo false; }
          {
            printf 'PAYMENTS_DRIVER=%s\n' "$(v="$(clean "$PAYMENTS_DRIVER")"; echo "${v:-paymongo}")"
            printf 'PAYMONGO_SECRET_KEY=%s\n' "$(clean "$PAYMONGO_SECRET_KEY")"
            printf 'PAYMONGO_PUBLIC_KEY=%s\n' "$(clean "$PAYMONGO_PUBLIC_KEY")"
            printf 'PAYMONGO_WEBHOOK_SECRET=%s\n' "$(clean "$PAYMONGO_WEBHOOK_SECRET")"
            printf 'PAYMONGO_SUBSCRIPTIONS=%s\n' "$(flag "$PAYMONGO_SUBSCRIPTIONS")"
            printf 'PAYMONGO_EWALLET=%s\n' "$(flag "$PAYMONGO_EWALLET")"
          } > paymongo.env
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes paymongo.env "$HOST:$DIR/deploy/.paymongo.env.tmp"
          rm -f paymongo.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v -e '^PAYMENTS_DRIVER=' -e '^PAYMONGO_' .env.production > .env.production.new || true
            cat .paymongo.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .paymongo.env.tmp
            echo 'PAYMONGO_* updated:'; grep -c '^PAYMONGO_' .env.production"

      - name: Apply the SENTRY_* settings to the server's .env.production (main-v2 only)
        if: ${{ env.V2 == 'true' && env.HAS_SENTRY == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || vars.SENTRY_DSN }}
          SENTRY_NALUZ_DSN: ${{ secrets.SENTRY_NALUZ_DSN || vars.SENTRY_NALUZ_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE || vars.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILES_SAMPLE_RATE || vars.SENTRY_PROFILES_SAMPLE_RATE }}
          SENTRY_ENABLE_LOGS: ${{ secrets.SENTRY_ENABLE_LOGS || vars.SENTRY_ENABLE_LOGS }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL || vars.LOG_CHANNEL }}
          LOG_STACK: ${{ secrets.LOG_STACK || vars.LOG_STACK }}
        run: |
          # The DSN (SENTRY_DSN, or SENTRY_NALUZ_DSN) from a secret or variable; the rates and switches from variables. Only what is set is written;
          # older SENTRY_ lines are replaced. LOG_CHANNEL and LOG_STACK (for example stack and single,sentry_logs) are written only when set.
          umask 077
          clean() { printf '%s' "$1" | tr -d '\r\n'; }
          : > sentry.env
          for k in SENTRY_DSN SENTRY_NALUZ_DSN SENTRY_TRACES_SAMPLE_RATE SENTRY_PROFILES_SAMPLE_RATE SENTRY_ENABLE_LOGS; do
            v="$(clean "${!k}")"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> sentry.env
          done
          for k in LOG_CHANNEL LOG_STACK; do
            v="$(clean "${!k}")"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> sentry.env
          done
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes sentry.env "$HOST:$DIR/deploy/.sentry.env.tmp"
          rm -f sentry.env
          $SSH "$HOST" "set -euo pipefail; cd '$DIR/deploy'; umask 077
            grep -v -e '^SENTRY_' -e '^LOG_CHANNEL=' -e '^LOG_STACK=' .env.production > .env.production.new || true
            cat .sentry.env.tmp >> .env.production.new
            mv .env.production.new .env.production; rm -f .sentry.env.tmp
            echo 'SENTRY_* updated:'; grep -c '^SENTRY_' .env.production"

      - name: Pull the release image and roll out the stack
        run: |
          $SSH "$HOST" "set -euo pipefail; cd '$DIR'
            docker pull '${IMAGE}:${TAG#v}'
            LOM_IMAGE='${IMAGE}' LOM_VERSION='${TAG#v}' docker stack deploy -c deploy/docker-stack.yml --with-registry-auth '${STACK}'
            docker service ls --filter 'name=${STACK}_'"

      - name: Wait until the new version is running
        run: |
          $SSH "$HOST" "set -u
            svc='${STACK}_web'
            want='${IMAGE}:${TAG#v}'
            for i in \$(seq 1 36); do
              state=\$(docker service inspect \"\$svc\" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              image=\$(docker service inspect \"\$svc\" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' | cut -d@ -f1)
              replicas=\$(docker service ls --filter name=\"\$svc\" --format '{{.Replicas}}')
              echo \"[\$i] image=\$image update=\${state:-none} replicas=\$replicas\"
              case \"\$state\" in rollback_*|paused) docker service ps \"\$svc\" --no-trunc | head -5; echo '--- last log lines of the service ---' >&2; docker service logs --tail 60 --no-task-ids \"\$svc\" 2>&1 | tail -60 >&2; exit 1;; esac
              if [ \"\$image\" = \"\$want\" ] && [ \"\$replicas\" = '1/1' ] && { [ -z \"\$state\" ] || [ \"\$state\" = completed ]; }; then
                echo 'The new version is running.'; exit 0
              fi
              sleep 5
            done
            echo 'Timed out waiting for '\$svc' to run '\$want >&2
            docker service ps \"\$svc\" --no-trunc | head -5
            echo '--- last log lines of the service ---' >&2
            docker service logs --tail 60 --no-task-ids \"\$svc\" 2>&1 | tail -60 >&2
            exit 1"

      - name: Check the live site answers
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://loveofmylife.love' }}
        run: |
          # a request through Traefik and TLS to the new container: the real proof that the deploy works
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/ping.json -w '%{http_code}' --max-time 10 "$SITE_URL/api/ping" || true)
            echo "[$i] GET $SITE_URL/api/ping -> HTTP $code"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/ping.json; then
              home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/")
              echo "GET $SITE_URL/ -> HTTP $home"
              [ "$home" = "200" ] && { echo 'The live site answers.'; exit 0; }
            fi
            sleep 5
          done
          echo "::error::$SITE_URL did not answer with HTTP 200 after the deploy."
          exit 1
