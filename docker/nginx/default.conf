# Traefik terminates TLS and forwards plain HTTP with X-Forwarded-Proto. Tell PHP the request was HTTPS so that
# cookies are Secure, HSTS is sent and the CSRF origin check sees the right scheme and port.
map $http_x_forwarded_proto $app_https {
    default off;
    https   on;
}
map $http_x_forwarded_proto $app_port {
    default 80;
    https   443;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # photos are resized in the browser before upload, so this is plenty
    client_max_body_size 16m;
    server_tokens off;

    # requests and errors go to the container log (docker service logs jinelin_web)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # only the front controller runs PHP
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $app_https;
        fastcgi_param SERVER_PORT $app_port;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ {
        return 404;
    }

    # static files (app.js/app.css carry a ?v= version, so long caching is safe)
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff2?|mp3|m4a|ogg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # never serve dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
