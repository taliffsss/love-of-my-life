# ============================================================
# deploy/docker-stack.yml  —  Love of My Life  (Swarm + shared Traefik)
#
#   https://loveofmylife.love (the product)
#
# Same pattern as hris-api / dink: the one shared Traefik (Swarm provider, certresolver `letsencrypt`, file middleware
# `redirect-to-https@file`) routes by Host() across the external `app_network`.
#
#   docker build -t taliffsss/loveofmylife:latest .
#   LOM_IMAGE=taliffsss/loveofmylife LOM_VERSION=latest docker stack deploy -c deploy/docker-stack.yml --with-registry-auth loveofmylife
#
# `.env.production` (next to this file, on the server only) holds the secrets: see deploy/.env.production.example.
# The release workflow (.github/workflows/release.yml) does all of this for a version tag.
#
# Own addresses (<name>.loveofmylife.love for Sweetheart and Forever pages) are switched off (SUBDOMAINS_ENABLED=false in
# .env.production). To turn them on, set that to true AND uncomment the "wildcard" labels below (see DEPLOY.md).
# ============================================================

services:
  web:
    # LOM_IMAGE must be the image the release workflow pushed (its DOCKER_IMAGE variable)
    image: ${LOM_IMAGE:-taliffsss/loveofmylife}:${LOM_VERSION:-latest}
    networks:
      - app_network
    env_file:
      - .env.production
    # Swarm must not run a container health check: it stopped a working container (see the Dockerfile).
    healthcheck:
      disable: true
    volumes:
      # photos list (carousel.json), the chosen song (song.json), logs and sessions survive redeploys
      - lom_storage:/var/www/html/storage
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first   # the new container is started before the old one is stopped
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          # accounts and page answers are Argon2id-hashed (19 MiB each, see config/security.php): room for parallel sign-ins
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app_network"

        # ── HTTPS router ──────────────────────────────────────────────────
        # Let's Encrypt issues the certificate for loveofmylife.love through the normal HTTP challenge (resolver `letsencrypt`).
        - "traefik.http.routers.loveofmylife.rule=Host(`loveofmylife.love`)"
        - "traefik.http.routers.loveofmylife.entrypoints=websecure"
        - "traefik.http.routers.loveofmylife.tls=true"
        - "traefik.http.routers.loveofmylife.tls.certresolver=letsencrypt"
        - "traefik.http.routers.loveofmylife.middlewares=loveofmylife-compress,loveofmylife-secure"
        - "traefik.http.routers.loveofmylife.service=loveofmylife"

        # ── HTTP → HTTPS redirect ─────────────────────────────────────────
        # redirect-to-https is defined in the main Traefik stack (file provider),
        # shared by every service on the same Swarm.
        - "traefik.http.routers.loveofmylife-http.rule=Host(`loveofmylife.love`)"
        - "traefik.http.routers.loveofmylife-http.entrypoints=web"
        - "traefik.http.routers.loveofmylife-http.middlewares=redirect-to-https@file"
        - "traefik.http.routers.loveofmylife-http.service=loveofmylife"

        # ── Own addresses: <name>.loveofmylife.love (OFF for now: feature flag SUBDOMAINS_ENABLED) ──────────────────
        # To enable: set SUBDOMAINS_ENABLED=true in .env.production, create the DNS record `*` -> this server, add a DNS-challenge
        # resolver `letsencrypt-dns` to the main Traefik stack (Let's Encrypt issues wildcards only that way, see DEPLOY.md), and
        # uncomment these lines (`$$` is a literal `$`: docker stack deploy interpolates `$`).
        # - "traefik.http.routers.loveofmylife-pages.rule=HostRegexp(`^[a-z0-9-]+\\.loveofmylife\\.love$$`)"
        # - "traefik.http.routers.loveofmylife-pages.entrypoints=websecure"
        # - "traefik.http.routers.loveofmylife-pages.tls=true"
        # - "traefik.http.routers.loveofmylife-pages.tls.certresolver=letsencrypt-dns"
        # - "traefik.http.routers.loveofmylife-pages.tls.domains[0].main=loveofmylife.love"
        # - "traefik.http.routers.loveofmylife-pages.tls.domains[0].sans=*.loveofmylife.love"
        # - "traefik.http.routers.loveofmylife-pages.middlewares=loveofmylife-compress,loveofmylife-secure"
        # - "traefik.http.routers.loveofmylife-pages.service=loveofmylife"
        # - "traefik.http.routers.loveofmylife-pages-http.rule=HostRegexp(`^[a-z0-9-]+\\.loveofmylife\\.love$$`)"
        # - "traefik.http.routers.loveofmylife-pages-http.entrypoints=web"
        # - "traefik.http.routers.loveofmylife-pages-http.middlewares=redirect-to-https@file"
        # - "traefik.http.routers.loveofmylife-pages-http.service=loveofmylife"

        # ── Service ───────────────────────────────────────────────────────
        - "traefik.http.services.loveofmylife.loadbalancer.server.port=80"
        # No Traefik health check either: with one replica there is nothing to fail over to, and a failing probe only turns
        # a working site into HTTP 503. The release workflow requests the live site after each deploy instead.

        # ── Middlewares ───────────────────────────────────────────────────
        # gzip/brotli at the edge, and tell the app the request arrived over HTTPS (Traefik terminates TLS).
        - "traefik.http.middlewares.loveofmylife-compress.compress=true"
        - "traefik.http.middlewares.loveofmylife-compress.compress.minresponsebodybytes=1024"
        - "traefik.http.middlewares.loveofmylife-secure.headers.sslProxyHeaders.X-Forwarded-Proto=https"

        # ── Logging labels ─────────────────────────────────────────────────
        - "logging.service=loveofmylife"
        - "logging.environment=production"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "logging.service,logging.environment"
        tag: "{{.Name}}"

networks:
  app_network:
    external: true
    attachable: true

volumes:
  lom_storage:
